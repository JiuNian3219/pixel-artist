name: Build and Deploy

on:
  push:
    branches: ['main', 'preview']
  pull_request:
    branches: ['main', 'preview']
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase owner
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/pixel-artist
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/preview' }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # 仅在 push 到分支时推送镜像，PR 仅构建验证
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}
            VITE_UMAMI_SCRIPT_URL=${{ secrets.VITE_UMAMI_SCRIPT_URL }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
            VITE_BASE_URL=${{ github.ref == 'refs/heads/preview' && '/pixel-artist/' || '/' }}
            BING_SITE_AUTH_USER=${{ secrets.BING_SITE_AUTH_USER }}
            VITE_ROBOTS_ALLOW=${{ vars.VITE_ROBOTS_ALLOW || '/' }}
          cache-to: type=inline

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Production
    # 只要不是 PR (即 Push 或 手动触发) 且在 main 分支，就部署
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Prepare image reference
        shell: bash
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pixel-artist:latest" >> "$GITHUB_ENV"

      - name: Deploy Production
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "Pulling latest image..."
            docker pull ${{ env.REGISTRY_IMAGE }}

            echo "Deploying Production Container..."
            docker rm -f pixel-artist || true
            docker run -d \
              --name pixel-artist \
              --restart unless-stopped \
              --network caddy_net \
              ${{ env.REGISTRY_IMAGE }}

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Preview
    # 只要不是 PR (即 Push 或 手动触发) 且在 preview 分支，就部署
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/preview'
    steps:
      - name: Prepare image reference
        shell: bash
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pixel-artist:preview" >> "$GITHUB_ENV"

      - name: Deploy Preview
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "Pulling preview image..."
            docker pull ${{ env.REGISTRY_IMAGE }}

            echo "Deploying Preview Container..."
            # 停止旧的 preview 容器
            docker rm -f pixel-artist-preview || true

            # 启动新容器
            docker run -d \
              --name pixel-artist-preview \
              --restart unless-stopped \
              --network caddy_net \
              ${{ env.REGISTRY_IMAGE }}